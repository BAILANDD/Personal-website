<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Variant A - Neon Arcade</title>
    <style>
      body { margin:0; background:#070916; color:#f2f5ff; font-family: "Trebuchet MS", sans-serif; }
      .bg { position:fixed; inset:0; background:
        radial-gradient(circle at 20% 20%, rgba(255,0,189,.24), transparent 24%),
        radial-gradient(circle at 82% 70%, rgba(0,221,255,.22), transparent 20%),
        linear-gradient(180deg, #070916, #0b1030);
      }
      .wrap { position:relative; width:min(1200px,92vw); margin:36px auto; }
      .hero { border:2px solid #5d5cff; box-shadow:8px 8px 0 #06091e; background:rgba(9,12,35,.9); padding:24px; }
      h1 { margin:0; font-size: clamp(2rem, 6vw, 4rem); letter-spacing: .06em; color:#7dffed; }
      p { font-size:1.2rem; color:#cfd5ff; }
      .cards { margin-top:16px; display:grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap:10px; }
      .card { border:2px solid #4a53a7; padding:14px; background:linear-gradient(180deg,#12183f,#0a1030); min-height:130px; }
      .chip { display:inline-block; padding:4px 8px; background:#ff41b4; color:#05070e; font-weight:bold; }
      a { color:#8be9ff; }
      @media (max-width:860px){ .cards{ grid-template-columns:1fr; } }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="wrap">
      <section class="hero">
        <span class="chip">NEON ARCADE</span>
        <h1>YOUR NAME</h1>
        <p>高对比霓虹像素风，适合作品高饱和展示与短视频封面统一。</p>
        <div class="cards">
          <div class="card">Gesture Drift</div><div class="card">Noise Choir</div><div class="card">Cursor Terrain</div>
        </div>
      </section>
      <p><a href="./style-lab.html">Back to Style Lab</a></p>
    </div>
  </body>
</html>
